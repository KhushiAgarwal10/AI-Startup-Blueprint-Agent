<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI-powered startup blueprint generator using IBM Granite on watsonx.ai" />
  <title>{% block title %}Startup Blueprint AI{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
  <!-- App CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm" id="mainNav">
    <div class="container-xl">

      <!-- Brand -->
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <span class="brand-icon">
          <i class="bi bi-rocket-takeoff-fill"></i>
        </span>
        <span class="brand-text">Startup Blueprint <span class="text-accent">AI</span></span>
      </a>

      <!-- Hamburger -->
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Nav links -->
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">
              <i class="bi bi-house me-1"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'chat' %}active{% endif %}" href="/chat">
              <i class="bi bi-chat-dots me-1"></i>Generate
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/dashboard">
              <i class="bi bi-grid-3x3-gap me-1"></i>Dashboard
            </a>
          </li>
        </ul>

        <!-- Dark mode toggle -->
        <div class="ms-lg-3 mt-2 mt-lg-0">
          <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
                  id="themeToggle" title="Toggle dark mode">
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            <span id="themeLabel">Dark</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer mt-auto">
    <div class="container-xl py-4">
      <div class="row align-items-center">
        <div class="col-md-6 mb-2 mb-md-0">
          <span class="brand-text fw-semibold">
            <i class="bi bi-rocket-takeoff-fill text-accent me-1"></i>
            Startup Blueprint AI
          </span>
          <span class="text-muted ms-2 small">
            Powered by IBM Granite on watsonx.ai
          </span>
        </div>
        <div class="col-md-6 text-md-end text-muted small">
          &copy; {{ current_year }} Startup Blueprint AI &mdash;
          Built for founders, by AI.
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmX0LfE4ZS7dCzrGg1ThkZKkEHXE"
          crossorigin="anonymous"></script>
  <!-- Marked (markdown parser) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- App JS -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
